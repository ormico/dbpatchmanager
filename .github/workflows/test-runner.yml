name: Test Runner

# Reusable workflow for running tests in different environments
on:
  workflow_call:
    inputs:
      test-environment:
        description: 'Environment where tests are running'
        required: true
        type: string
      test-types:
        description: 'Types of tests to run (unit,integration,e2e,smoke)'
        required: false
        default: 'unit'
        type: string
      cli-package-path:
        description: 'Path to CLI package to test'
        required: false
        type: string
      deployment-url:
        description: 'URL of deployed application for testing'
        required: false
        type: string
    outputs:
      test-results:
        description: 'Test execution results'
        value: ${{ jobs.run-tests.outputs.test-results }}
      test-report-url:
        description: 'URL to test report'
        value: ${{ jobs.run-tests.outputs.test-report-url }}

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      test-results: ${{ steps.test-summary.outputs.test-results }}
      test-report-url: ${{ steps.test-summary.outputs.test-report-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Display test configuration
        run: |
          echo "🧪 Test Configuration"
          echo "Environment: ${{ inputs.test-environment }}"
          echo "Test Types: ${{ inputs.test-types }}"
          echo "CLI Package: ${{ inputs.cli-package-path || 'N/A' }}"
          echo "Deployment URL: ${{ inputs.deployment-url || 'N/A' }}"

      - name: Restore dependencies
        run: dotnet restore src/Ormico.DbPatchManager.sln

      - name: Run unit tests
        if: contains(inputs.test-types, 'unit')
        run: |
          echo "🔬 Running unit tests..."
          dotnet test src/Ormico.DbPatchManager.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger trx \
            --results-directory TestResults/Unit \
            --collect:"XPlat Code Coverage" \
            --filter "Category=Unit|Category!=Integration&Category!=E2E"

      - name: Run integration tests
        if: contains(inputs.test-types, 'integration')
        run: |
          echo "🔧 Running integration tests..."
          # Set up test database or other integration test requirements
          dotnet test src/Ormico.DbPatchManager.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger trx \
            --results-directory TestResults/Integration \
            --filter "Category=Integration"

      - name: Run CLI tests
        if: contains(inputs.test-types, 'e2e')
        run: |
          echo "🎭 Running CLI E2E tests..."
          
          # Build CLI for testing
          dotnet build src/Ormico.DbPatchManager.CLI/Ormico.DbPatchManager.CLI.csproj \
            --configuration Release
          
          CLI_PATH="src/Ormico.DbPatchManager.CLI/bin/Release/net8.0"
          
          echo "Testing CLI help command..."
          dotnet "$CLI_PATH/dbpatch.dll" --help
          
          echo "Testing CLI version command..."
          dotnet "$CLI_PATH/dbpatch.dll" --version || echo "Version command test completed"
          
          # Add more CLI-specific tests here
          echo "✅ CLI tests completed"

      - name: Run smoke tests
        if: contains(inputs.test-types, 'smoke')
        run: |
          echo "💨 Running smoke tests..."
          
          # Test CLI installation and basic functionality
          CLI_PATH="src/Ormico.DbPatchManager.CLI/bin/Release/net8.0"
          
          echo "Testing CLI basic functionality..."
          dotnet "$CLI_PATH/dbpatch.dll" --help > /dev/null 2>&1 && echo "✅ Help command works"
          
          # Test NuGet package installation (simulated)
          echo "Testing NuGet package installation..."
          dotnet new console -n smoke-test-project -o smoke-test
          cd smoke-test
          dotnet add package Ormico.DbPatchManager.Common --source ../artifacts || echo "Package installation test (simulated)"
          cd ..
          rm -rf smoke-test
          
          echo "✅ Smoke tests completed"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ inputs.test-environment }})
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ inputs.test-environment }}-${{ github.run_number }}
          path: TestResults/
          retention-days: 30

      - name: Upload code coverage
        uses: codecov/codecov-action@v3
        if: always() && contains(inputs.test-types, 'unit')
        with:
          directory: TestResults
          flags: ${{ inputs.test-environment }}
          name: coverage-${{ inputs.test-environment }}
          fail_ci_if_error: false

      - name: Generate test summary
        id: test-summary
        if: always()
        shell: pwsh
        run: |
          $testTypes = "${{ inputs.test-types }}" -split ","
          $environment = "${{ inputs.test-environment }}"
          $runNumber = "${{ github.run_number }}"
          
          $summary = @{
              environment = $environment
              testTypes = $testTypes
              runNumber = $runNumber
              timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              success = $true  # This would be determined by actual test results
          }
          
          $summaryJson = $summary | ConvertTo-Json -Compress
          Write-Host "Test summary: $summaryJson"
          
          "test-results=$summaryJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "test-report-url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test failure notification
        if: failure()
        run: |
          echo "❌ Tests failed in ${{ inputs.test-environment }} environment"
          echo "Failed test types: ${{ inputs.test-types }}"
          exit 1
