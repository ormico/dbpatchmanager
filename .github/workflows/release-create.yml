name: Release Creation

on:
  push:
    branches: [ 'release/*' ]
  workflow_dispatch:
    inputs:
      deploy_to_dev:
        description: 'Deploy to development environment'
        required: false
        default: true
        type: boolean

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  # Validate release branch and extract release information
  validate-release:
    name: Validate Release Branch
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release-info.outputs.release-id }}
      is-valid: ${{ steps.release-info.outputs.is-valid }}
    steps:
      - name: Extract release information
        id: release-info
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Branch name: $BRANCH_NAME"
          
          # Validate release branch naming: release/YYYY-MM-DD-NN
          if [[ $BRANCH_NAME =~ ^release/([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+)$ ]]; then
            RELEASE_ID="${BASH_REMATCH[1]}"
            echo "release-id=$RELEASE_ID" >> $GITHUB_OUTPUT
            echo "is-valid=true" >> $GITHUB_OUTPUT
            echo "✓ Valid release branch: $BRANCH_NAME"
            echo "✓ Release ID: $RELEASE_ID"
          else
            echo "is-valid=false" >> $GITHUB_OUTPUT
            echo "❌ Invalid release branch name: $BRANCH_NAME"
            echo "Expected format: release/YYYY-MM-DD-NN (e.g., release/2024-03-15-01)"
          fi

      - name: Fail on invalid branch name
        if: steps.release-info.outputs.is-valid != 'true'
        run: |
          echo "❌ Release branch name is invalid"
          echo "Please use the format: release/YYYY-MM-DD-NN"
          echo "Example: release/2024-03-15-01"
          exit 1

  # Build and create release artifacts
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: validate-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      full-version: ${{ steps.version.outputs.full-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version information
        id: version
        shell: pwsh
        run: |
          $releaseId = "${{ needs.validate-release.outputs.release-id }}"
          ./.github/scripts/version-management.ps1 -Action get-build -BuildNumber ${{ github.run_number }}
          
          # Create release tag
          if (Test-Path "version.json") {
              $versionData = Get-Content version.json -Raw | ConvertFrom-Json
              $releaseTag = "v$($versionData.version).${{ github.run_number }}"
          } else {
              Write-Warning "version.json not found after version management script. Using default version 0.1.0"
              $releaseTag = "v0.1.0.${{ github.run_number }}"
          }
          Write-Host "Release tag: $releaseTag"
          "release-tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore src/Ormico.DbPatchManager.sln

      - name: Build application
        run: |
          dotnet build src/Ormico.DbPatchManager.sln \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-restore \
            -p:Version=${{ steps.version.outputs.full-version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.full-version }}

      - name: Run tests
        run: |
          dotnet test src/Ormico.DbPatchManager.sln \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            --verbosity normal \
            --logger trx \
            --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Release Build Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Create CLI artifact package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.full-version }}"
          $artifactName = "dbpatch-manager-cli-$version"
          $cliPath = "src/Ormico.DbPatchManager.CLI/bin/${{ env.BUILD_CONFIGURATION }}/net8.0"
          
          # Create artifact directory
          New-Item -ItemType Directory -Path "release-artifacts" -Force
          
          # Copy CLI files to staging
          $stagingPath = "release-artifacts/staging"
          New-Item -ItemType Directory -Path $stagingPath -Force
          
          # Copy all CLI output files
          Copy-Item -Path "$cliPath/*" -Destination $stagingPath -Recurse -Force
          
          # Ensure script files have correct line endings and permissions
          if (Test-Path "$stagingPath/dbpatch") {
              # Convert to Unix line endings for the shell script
              $content = Get-Content "$stagingPath/dbpatch" -Raw
              $content = $content -replace "`r`n", "`n"
              Set-Content "$stagingPath/dbpatch" -Value $content -NoNewline
          }
          
          # Create zip archive
          Compress-Archive -Path "$stagingPath/*" -DestinationPath "release-artifacts/$artifactName.zip" -Force
          
          Write-Host "Created CLI artifact: release-artifacts/$artifactName.zip"
          
          # List contents for verification
          Get-ChildItem "release-artifacts/$artifactName.zip" | ForEach-Object { Write-Host "Artifact size: $($_.Length) bytes" }

      - name: Create NuGet package
        run: |
          VERSION="${{ steps.version.outputs.full-version }}"
          echo "Creating NuGet package with version: $VERSION"
          
          dotnet pack src/Ormico.DbPatchManager.Common/Ormico.DbPatchManager.Common.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --no-build \
            -p:Version=$VERSION \
            -p:PackageVersion=$VERSION \
            --output release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts-${{ needs.validate-release.outputs.release-id }}
          path: |
            release-artifacts/*.zip
            release-artifacts/*.nupkg
          retention-days: 365

  # Package validation and testing
  package-validation:
    name: Validate Release Packages
    runs-on: ubuntu-latest
    needs: [validate-release, build-release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download release artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts-${{ needs.validate-release.outputs.release-id }}
          path: release-artifacts/

      - name: Validate CLI package
        shell: pwsh
        run: |
          $version = "${{ needs.build-release.outputs.full-version }}"
          $zipFile = "release-artifacts/dbpatch-manager-cli-$version.zip"
          
          if (-not (Test-Path $zipFile)) {
              Write-Error "CLI package not found: $zipFile"
              exit 1
          }
          
          Write-Host "✓ CLI package found: $zipFile"
          $zipInfo = Get-Item $zipFile
          Write-Host "  Size: $($zipInfo.Length) bytes"
          
          # Extract and validate contents
          $extractPath = "temp-extract"
          Expand-Archive -Path $zipFile -DestinationPath $extractPath -Force
          
          $requiredFiles = @("dbpatch.dll", "dbpatch.cmd", "dbpatch")
          foreach ($file in $requiredFiles) {
              if (Test-Path "$extractPath/$file") {
                  Write-Host "✓ Required file found: $file"
              } else {
                  Write-Error "❌ Required file missing: $file"
                  exit 1
              }
          }
          
          # Test CLI execution
          Set-Location $extractPath
          dotnet dbpatch.dll --help > $null 2>&1
          if ($?) {
              Write-Host "✓ CLI executable is valid"
          } else {
              Write-Host "⚠ CLI help command failed (this might be expected without full setup)"
          }

      - name: Validate NuGet package
        run: |
          VERSION="${{ needs.build-release.outputs.full-version }}"
          NUPKG_FILE="release-artifacts/Ormico.DbPatchManager.Common.$VERSION.nupkg"
          
          if [ ! -f "$NUPKG_FILE" ]; then
              echo "❌ NuGet package not found: $NUPKG_FILE"
              exit 1
          fi
          
          echo "✓ NuGet package found: $NUPKG_FILE"
          ls -la "$NUPKG_FILE"
          
          # Validate package contents using dotnet
          dotnet nuget verify "$NUPKG_FILE" || echo "Package verification completed"
          
          echo "✅ Release packages validated successfully"

  # Create GitHub release
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, package-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts-${{ needs.validate-release.outputs.release-id }}
          path: release-artifacts/

      - name: Generate release notes
        id: release-notes
        run: |
          RELEASE_ID="${{ needs.validate-release.outputs.release-id }}"
          RELEASE_TAG="${{ needs.build-release.outputs.release-tag }}"
          VERSION="${{ needs.build-release.outputs.full-version }}"
          
          # Generate release notes (this could be enhanced with automated changelog generation)
          cat > release-notes.md << EOF
          # DbPatchManager Release $RELEASE_TAG
          
          ## 📦 Release Information
          - **Release ID**: $RELEASE_ID
          - **Version**: $VERSION
          - **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Branch**: ${GITHUB_REF#refs/heads/}
          - **Commit**: ${{ github.sha }}
          
          ## � Release Assets
          - **CLI Package**: \`dbpatch-manager-cli-$VERSION.zip\` - Complete CLI tool with executable, script files, and dependencies
          - **NuGet Package**: \`Ormico.DbPatchManager.Common.$VERSION.nupkg\` - Common library for database module development
          
          ## 📋 Changes
          _Release notes would be generated from commit history or changelog_
          
          ## � Installation
          
          ### CLI Tool
          1. Download and extract \`dbpatch-manager-cli-$VERSION.zip\`
          2. Add the extracted directory to your PATH
          3. Run \`dbpatch --help\` to get started
          
          ### NuGet Package
          \`\`\`
          dotnet add package Ormico.DbPatchManager.Common --version $VERSION
          \`\`\`
          EOF
          
          echo "Release notes generated:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseNotes = fs.readFileSync('release-notes.md', 'utf8');
            
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ needs.build-release.outputs.release-tag }}",
              target_commitish: context.sha,
              name: "DbPatchManager ${{ needs.build-release.outputs.release-tag }}",
              body: releaseNotes,
              draft: false,
              prerelease: false
            });
            
            console.log(`✅ Release created: ${release.data.html_url}`);
            
            // Upload release assets
            const version = "${{ needs.build-release.outputs.full-version }}";
            const artifactsDir = "release-artifacts";
            
            // Upload CLI zip
            const cliZipPath = path.join(artifactsDir, `dbpatch-manager-cli-${version}.zip`);
            if (fs.existsSync(cliZipPath)) {
              const cliZipData = fs.readFileSync(cliZipPath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `dbpatch-manager-cli-${version}.zip`,
                data: cliZipData,
              });
              console.log('✅ CLI package uploaded');
            }
            
            // Upload NuGet package
            const nupkgPath = path.join(artifactsDir, `Ormico.DbPatchManager.Common.${version}.nupkg`);
            if (fs.existsSync(nupkgPath)) {
              const nupkgData = fs.readFileSync(nupkgPath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `Ormico.DbPatchManager.Common.${version}.nupkg`,
                data: nupkgData,
              });
              console.log('✅ NuGet package uploaded');
            }
            
            // Set output for subsequent jobs
            core.setOutput('release-id', release.data.id);
            core.setOutput('release-url', release.data.html_url);

  # Optional NuGet package publishing
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, package-validation, create-github-release]
    if: ${{ inputs.deploy_to_dev != false }}  # Deploy by default unless explicitly disabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts-${{ needs.validate-release.outputs.release-id }}
          path: release-artifacts/

      - name: Publish to NuGet
        run: |
          VERSION="${{ needs.build-release.outputs.full-version }}"
          NUPKG_FILE="release-artifacts/Ormico.DbPatchManager.Common.$VERSION.nupkg"
          
          echo "🚀 Publishing NuGet package"
          echo "Package: $NUPKG_FILE"
          echo "Version: $VERSION"
          
          # Publish to NuGet.org
          dotnet nuget push "$NUPKG_FILE" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
          echo "✅ NuGet package published to nuget.org"

      - name: Verify package availability
        run: |
          VERSION="${{ needs.build-release.outputs.full-version }}"
          
          echo "🔍 Verifying package availability on NuGet.org"
          echo "Package: Ormico.DbPatchManager.Common"
          echo "Version: $VERSION"
          
          # Wait a moment for the package to be indexed
          echo "Waiting 30 seconds for package indexing..."
          sleep 30
          
          # Check if package is available (this will retry a few times)
          for i in {1..5}; do
            echo "Verification attempt $i/5..."
            if curl -s "https://api.nuget.org/v3-flatcontainer/ormico.dbpatchmanager.common/$VERSION/ormico.dbpatchmanager.common.nuspec" | grep -q "Ormico.DbPatchManager.Common"; then
              echo "✅ Package verified as available on NuGet.org"
              break
            else
              echo "Package not yet available, waiting..."
              sleep 10
            fi
          done

  # Summary job
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [validate-release, build-release, package-validation, create-github-release, publish-nuget]
    if: always()
    steps:
      - name: Determine overall result
        id: result
        run: |
          BUILD_RESULT="${{ needs.build-release.result }}"
          PACKAGE_RESULT="${{ needs.package-validation.result }}"
          RELEASE_RESULT="${{ needs.create-github-release.result }}"
          PUBLISH_RESULT="${{ needs.publish-nuget.result }}"
          
          echo "Build: $BUILD_RESULT"
          echo "Package Validation: $PACKAGE_RESULT"
          echo "GitHub Release: $RELEASE_RESULT"
          echo "NuGet Publish: $PUBLISH_RESULT"
          
          if [[ "$BUILD_RESULT" != "success" ]] || [[ "$PACKAGE_RESULT" != "success" ]] || [[ "$RELEASE_RESULT" != "success" ]]; then
            echo "overall-result=failure" >> $GITHUB_OUTPUT
            echo "❌ Release creation failed"
          elif [[ "$PUBLISH_RESULT" == "failure" ]]; then
            echo "overall-result=partial" >> $GITHUB_OUTPUT
            echo "⚠️ Release created but NuGet publishing failed"
          else
            echo "overall-result=success" >> $GITHUB_OUTPUT
            echo "✅ Release created and published successfully"
          fi

      - name: Create summary
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            const buildResult = "${{ needs.build-release.result }}";
            const packageResult = "${{ needs.package-validation.result }}";
            const releaseResult = "${{ needs.create-github-release.result }}";
            const publishResult = "${{ needs.publish-nuget.result }}";
            const overallResult = "${{ steps.result.outputs.overall-result }}";
            const version = "${{ needs.build-release.outputs.full-version }}";
            
            const getEmoji = (result) => {
              if (result === 'success') return '✅';
              if (result === 'failure') return '❌';
              if (result === 'skipped') return '⏭️';
              return '⚠️';
            };
            
            let summary = `# 🎉 DbPatchManager Release Creation Results\n\n`;
            summary += `**Release ID:** \`${{ needs.validate-release.outputs.release-id }}\`\n`;
            summary += `**Version:** \`${version}\`\n`;
            summary += `**Release Tag:** \`${{ needs.build-release.outputs.release-tag }}\`\n`;
            summary += `**Overall Result:** ${getEmoji(overallResult)} ${overallResult}\n\n`;
            
            summary += `## Release Steps\n\n`;
            summary += `| Step | Status |\n`;
            summary += `|------|--------|\n`;
            summary += `| Build & Test | ${getEmoji(buildResult)} ${buildResult} |\n`;
            summary += `| Package Validation | ${getEmoji(packageResult)} ${packageResult} |\n`;
            summary += `| GitHub Release | ${getEmoji(releaseResult)} ${releaseResult} |\n`;
            summary += `| NuGet Publish | ${getEmoji(publishResult)} ${publishResult} |\n`;
            
            summary += `\n## 📦 Release Artifacts\n\n`;
            summary += `- **CLI Package:** \`dbpatch-manager-cli-${version}.zip\`\n`;
            summary += `- **NuGet Package:** \`Ormico.DbPatchManager.Common.${version}.nupkg\`\n`;
            
            summary += `\n**Workflow Run:** [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            
            // Write to GitHub Step Summary
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

      - name: Notify on failure
        if: steps.result.outputs.overall-result == 'failure'
        run: |
          echo "❌ Release creation failed"
          exit 1
